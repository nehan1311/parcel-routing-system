spring:
  application:
    name: parcel-routing
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/parcel_routing}
    username: ${SPRING_DATASOURCE_USERNAME:parcel}
    password: ${SPRING_DATASOURCE_PASSWORD:parcel}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info
