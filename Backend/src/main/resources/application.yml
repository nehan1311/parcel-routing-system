spring:
  application:
    name: parcel-routing

  datasource:
    url: jdbc:postgresql://localhost:5432/parcel_routing
    username: postgres
    password: Neha@131105

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info

parcel:
  security:
    # Local development credentials only. Override with PARCEL_*_PASSWORD variables.
    operator-password: ${PARCEL_OPERATOR_PASSWORD:operator-local-only}
    approver-password: ${PARCEL_APPROVER_PASSWORD:approver-local-only}
    admin-password: ${PARCEL_ADMIN_PASSWORD:admin-local-only}
