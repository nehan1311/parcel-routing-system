server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: parcel-routing

  servlet:
    multipart:
      max-file-size: ${PARCEL_BATCH_MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${PARCEL_BATCH_MAX_UPLOAD_SIZE:10MB}

  datasource:
    url: ${PARCEL_DB_URL:jdbc:postgresql://localhost:5432/parcel_routing}
    username: ${PARCEL_DB_USERNAME}
    password: ${PARCEL_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health

parcel:
  config:
    historical-impact-limit: ${PARCEL_HISTORICAL_IMPACT_LIMIT:100}

  batch:
    max-upload-size: ${PARCEL_BATCH_MAX_UPLOAD_SIZE:10MB}

  security:
    # Local development credentials only. Override with PARCEL_*_PASSWORD variables.
    operator-password: ${PARCEL_OPERATOR_PASSWORD:operator-local-only}
    approver-password: ${PARCEL_APPROVER_PASSWORD:approver-local-only}
    admin-password: ${PARCEL_ADMIN_PASSWORD:admin-local-only}
