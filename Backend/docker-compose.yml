services:
  app:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /workspace
    command: mvn spring-boot:run
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/parcel_routing
      SPRING_DATASOURCE_USERNAME: parcel
      SPRING_DATASOURCE_PASSWORD: parcel
    volumes:
      - .:/workspace
      - maven-repo:/root/.m2
    depends_on:
      - db

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: parcel_routing
      POSTGRES_USER: parcel
      POSTGRES_PASSWORD: parcel
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  maven-repo:
  postgres-data:
